<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Free Resume Builder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Free Resume Builder</h1>
  <p>Create a professional resume in minutes</p>
</header>

<div class="container">

  <!-- FORM -->
  <div class="form">
    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="email" placeholder="Email">
    <input type="text" id="phone" placeholder="Phone Number">

    <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
    <textarea id="education" placeholder="Education"></textarea>
    <textarea id="experience" placeholder="Experience"></textarea>

    <select id="template" onchange="changeTemplate()">
      <option value="classic">Classic Template</option>
      <option value="modern">Modern Template</option>
    </select>

    <button onclick="updateResume()">Preview Resume</button>
    <button onclick="downloadPDF()">Download PDF</button>
  </div>

  <!-- RESUME PREVIEW -->
  <div class="resume" id="resume">
    <h2 id="r-name">Your Name</h2>
    <p id="r-email">Email</p>
    <p id="r-phone">Phone</p>

    <h3>Skills</h3>
    <p id="r-skills"></p>

    <h3>Education</h3>
    <p id="r-education"></p>

    <h3>Experience</h3>
    <p id="r-experience"></p>

    <small id="watermark">
      Created with Free Resume Builder – Upgrade to remove watermark
    </small>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
